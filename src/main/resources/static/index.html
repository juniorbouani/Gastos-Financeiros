<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./img/favicon-flowbank.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Login - FlowBank</title>
  </head>
  <body>
    <div class="login-container">
      <div class="brand-section">
        <div class="logo-container">
          <div class="logo-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M4 15C7 9 10 9 12 13C14 17 17 15 20 9"
                stroke="white"
                stroke-width="2.5"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <span class="logo-text">FlowBank</span>
        </div>

        <div class="brand-hero">
          <h1>Seu dinheiro,<br />sem complicação.</h1>
          <p>
            Um banco digital pensado para ser simples de usar, do jeito que for
            melhor para você.
          </p>
        </div>
      </div>

      <div class="login-conteudo">
        <form id="login-form" class="form-wrapper">
          <h3 class="form-title">Entrar</h3>

          <div class="caixa-de-login">
            <div class="input-group">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                inputmode="numeric" autocomplete="username" maxlength="14"
                pattern="[0-9]{11}|[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                title="Informe os 11 números do CPF, com ou sem pontuação" required />
            </div>

            <div class="input-group">
              <div class="label-row">
                <label for="senha">Senha</label>
              </div>
              <div class="input-password-wrapper">
                <input
                  type="password"
                  id="senha"
                  name="senha"
                  autocomplete="current-password"
                  required
                  placeholder="Digite sua senha"
                />
                <button
                  type="button"
                  class="btn-toggle-eye"
                  aria-label="Mostrar senha"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <p id="login-mensagem" class="login-mensagem" role="alert" hidden></p>
          <button type="submit" id="login-botao" class="botao">Entrar &rarr;</button>

          <p class="signup-text">
            Não tem conta? <a href="./cadastro/cadastro.html">Abrir conta</a>
          </p>
        </form>
      </div>
    </div>
    <script src="./js/login.js" defer></script>
  </body>
</html>
