<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Cadastro - FlowBank</title>
  </head>
  <body>
    <div class="cadastro-container">
      <div class="cadastro-conteudo">
        <h1>FlowBank</h1>
        <h3>Cadastro</h3>
        <div class="caixa-de-cadastro">
          <label for="name">Nome Completo:</label>
          <input type="text" id="name" />
          <label for="cpf">CPF:</label>
          <input type="number" id="cpf" placeholder="XXX.XXX.XXX-XX"/>
          <label for="dataNascimento">Data de Nascimento:</label>
          <input type="date" id="dataNascimento" />
          <label for="numeroTelefone">Telefone:</label>
          <input type="tel" id="numeroTelefone" placeholder="(00) 00000-0000"/>
          <label for="email">Email:</label>
          <input type="email" id="email" />
          <label for="senhaHash">Senha:</label>
          <input type="password" id="senhaHash" />
          <label for="confirmarSenha">Confirmar Senha:</label>
          <input type="password" id="confirmarSenha" />
        </div>
        <a class="botao" href="../PaginaInicial/paginainicial.html">CADASTRAR</a>
        <p>
          Já tem cadastro?
          <a href="../index.html">Entre em sua conta aqui!</a>
        </p>
      </div>
    </div>
  </body>
</html>
