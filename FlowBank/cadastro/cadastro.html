<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="../img/favicon-flowbank.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Cadastro - FlowBank</title>
  </head>
  <body>
    <div class="cadastro-container">
      <div class="brand-section">
        <div class="logo-container">
          <div class="logo-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M4 15C7 9 10 9 12 13C14 17 17 15 20 9"
                stroke="white"
                stroke-width="2.5"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <span class="logo-text">FlowBank</span>
        </div>

        <div class="brand-hero">
          <h1>Abra sua conta em poucos minutos.</h1>
          <p>
            Junte-se ao banco digital que simplifica sua vida financeira com
            segurança e controle total.
          </p>
        </div>
      </div>

      <div class="cadastro-conteudo">
        <div class="form-wrapper">
          <h3 class="form-title">Criar Conta</h3>

          <div class="caixa-de-cadastro">
            <div class="input-group">
              <label for="name">Nome Completo:</label>
              <input type="text" id="name" placeholder="Seu nome completo" />
            </div>

            <div class="input-group-row">
              <div class="input-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" />
              </div>

              <div class="input-group">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" />
              </div>
            </div>

            <div class="input-group-row">
              <div class="input-group">
                <label for="numeroTelefone">Telefone:</label>
                <input
                  type="tel"
                  id="numeroTelefone"
                  placeholder="(00) 00000-0000"
                />
              </div>

              <div class="input-group">
                <label for="email">Email:</label>
                <input
                  type="email"
                  id="email"
                  placeholder="seuemail@exemplo.com"
                />
              </div>
            </div>

            <div class="input-group-row">
              <div class="input-group">
                <label for="senhaHash">Senha:</label>
                <input
                  type="password"
                  id="senhaHash"
                  placeholder="Digite sua senha"
                />
              </div>

              <div class="input-group">
                <label for="confirmarSenha">Confirmar Senha:</label>
                <input
                  type="password"
                  id="confirmarSenha"
                  placeholder="Confirme sua senha"
                />
              </div>
            </div>
          </div>

          <a class="botao" href="../PaginaInicial/paginainicial.html"
            >CADASTRAR &rarr;</a
          >

          <p class="signup-text">
            Já tem cadastro?
            <a href="../index.html">Entre em sua conta aqui!</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
