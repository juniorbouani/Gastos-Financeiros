<!doctype html>
<html lang="pt-br">
  <head>
    <link
      rel="shortcut icon"
      href="../img/favicon-flowbank.svg"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Confirmar Dados - FlowBank</title>
  </head>
  <body>
    <!-- Layout Principal Dashboard -->
    <div class="app-dashboard">
      <!-- Sidebar Lateral Esquerda -->
      <aside class="sidebar-lateral">
        <div class="sidebar-top">
          <div class="brand-logo">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M4 15C7 9 10 9 12 13C14 17 17 15 20 9"
                stroke="#3b25eb"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
            <span>FlowBank</span>
          </div>

          <nav class="sidebar-nav">
            <a href="../PaginaInicial/paginainicial.html" class="nav-item">
              <img src="../img/home.svg" alt="" />
              <span>Início</span>
            </a>
            <a href="../pagamentos/pagar/extrato.html" class="nav-item">
              <img src="../img/Pagar.svg" alt="" />
              <span>Extrato</span>
            </a>
            <a href="../pagamentos/pix.html" class="nav-item">
              <img src="../img/Pix.svg" alt="" />
              <span>Transferir</span>
            </a>
            <a href="../pagamentos/pagar/pagar.html" class="nav-item">
              <img src="../img/Pagar.svg" alt="" />
              <span>Pagar</span>
            </a>
            <a href="../cartoes/cartoes.html" class="nav-item">
              <img src="../img/Cartao.svg" alt="" />
              <span>Cartões</span>
            </a>
            <a href="../shop/shop.html" class="nav-item">
              <img src="../img/Shop.svg" alt="" />
              <span>Shop</span>
            </a>
            <a href="../configuracoes/configuracoes.html" class="nav-item active">
              <img src="../img/Configuracoes.svg" alt="" />
              <span>Configurações</span>
            </a>
          </nav>
        </div>

        <div class="sidebar-bottom">
          <a href="../index.html" class="nav-item logout">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Sair</span>
          </a>
        </div>
      </aside>

      <!-- Conteúdo Central -->
      <main class="menu-container">
        <!-- Header com botão voltar -->
        <header class="header-conteudo pix-header">
          <div class="extrato-header-title">
            <a href="javascript:history.back()" class="btn-voltar">
              <img src="../img/Voltar.svg" alt="Voltar" />
            </a>
            <h1>Confirme os Dados</h1>
          </div>
          <nav class="header-navegacao">
            <a href="../notificacoes/notificacoes.html">
              <img src="../img/Notificacoes.svg" alt="Notificações" />
            </a>
            <a href="../perfil/perfil.html">
              <img src="../img/Conta.svg" alt="Perfil" />
            </a>
          </nav>
        </header>

        <!-- Container de Confirmação -->
        <div class="pix-page-container">
          <div class="confirmar-card">
            <div class="confirmar-card-header">
              <div class="confirmar-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b25eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
              </div>
              <h2>Resumo da Operação</h2>
              <p>Verifique as informações antes de finalizar</p>
            </div>

            <!-- Lista de Dados do Usuário -->
            <div class="confirmar-dados-list">
              <div class="dado-row">
                <span class="dado-label">Nome</span>
                <span class="dado-value">{name}</span>
              </div>

              <div class="dado-row">
                <span class="dado-label">CPF</span>
                <span class="dado-value">{cpf}</span>
              </div>

              <div class="dado-row">
                <span class="dado-label">E-mail</span>
                <span class="dado-value">{email}</span>
              </div>

              <div class="dado-row">
                <span class="dado-label">Telefone</span>
                <span class="dado-value">{numeroTelefone}</span>
              </div>
            </div>

            <button type="button" class="btn-confirmar-final">
              CONFIRMAR
            </button>
          </div>
        </div>

        <!-- Footer Mobile -->
        <footer class="footer-principal-container">
          <div class="footer-principal-conteudo">
            <div class="footer-principal-nav">
              <a href="../PaginaInicial/paginainicial.html">
                <img src="../img/home.svg" alt="" />
                <p>Home</p>
              </a>
            </div>

            <div class="footer-principal-nav">
              <a href="../emprestimo/emprestimo.html">
                <img src="../img/emprestimo.svg" alt="" />
                <p class="palavra-limitada">Empréstimo</p>
              </a>
            </div>

            <div class="footer-principal-nav">
              <a href="../cartoes/cartoes.html">
                <img src="../img/Cartao.svg" alt="" />
                <p>Cartões</p>
              </a>
            </div>

            <div class="footer-principal-nav">
              <a href="../shop/shop.html">
                <img src="../img/Shop.svg" alt="" />
                <p>Shop</p>
              </a>
            </div>

            <div class="footer-principal-nav">
              <a href="../configuracoes/configuracoes.html">
                <img src="../img/Configuracoes.svg" alt="" />
                <p class="palavra-limitada">Configurações</p>
              </a>
            </div>
          </div>
        </footer>
      </main>
    </div>

    <script src="../js/main.js"></script>
  </body>
</html>
